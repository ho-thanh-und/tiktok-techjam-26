[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-ml-research-agent"
version = "0.1.0"
description = "Budgeted, resumable autonomous ML experiment orchestration"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
automl-agent = "automl_agent.cli:main"

[tool.setuptools.packages.find]
include = ["automl_agent*"]

